name: Verify CampusOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: campusos-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: campusos-ci-only
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
      - run: unzip -q CampusOS-Android.zip -d android
      - run: chmod +x android/gradlew
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug testDebugUnitTest --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: CampusOS-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
